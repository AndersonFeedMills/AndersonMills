<!--
 * File repo: AndersonFeedMills/AndersonMills
 * File name: index.html
 * Movements: Add the visible OPEN control to the existing storefront door while preserving the existing storefront image, door position, and /mill/ entrance.
 *
 * Purpose:
 * Keep the Anderson Mills storefront as the visual entrance and place OPEN over the existing door.
 *
 * Does NOT:
 * Change the storefront artwork.
 * Change the /mill/ entrance.
 * Change recipes, animals, forum, marketplace, or service pages.
 * Create additional files.
 -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anderson Mills</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .storefront {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .door {
      position: absolute;

      /* Physical 36" × 72" door — set to the door in the image */
      left: 50%;
      top: 50%;
      width: 10%;
      height: 45%;

      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      background: transparent;
      border: 0;
      padding: 0;
    }

    .open {
      display: inline-block;
      padding: 0.7rem 1.4rem;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
    }
  </style>
</head>

<body>
  <main>

    <img
      class="storefront"
      src="/graphics/gimg_1789946532267_41keb4md.png"
      alt="Anderson Mills"
    >

    <a
      class="door"
      href="/mill/"
      aria-label="Enter Anderson Mills"
    >
      <span class="open">OPEN</span>
    </a>

  </main>
</body>
</html>

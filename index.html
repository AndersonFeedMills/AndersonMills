<!--
 * File repo: AndersonFeedMills/AndersonMills
 * File name: index.html
 * Movements: Render the existing storefront first on mobile and desktop;
 * preserve the existing storefront image, physical door position, visible
 * OPEN control, and /mill/ entrance.
 *
 * Purpose:
 * Render Anderson Mills as the visual storefront entrance across mobile
 * and desktop devices.
 *
 * Does NOT:
 * Change the storefront artwork.
 * Change the /mill/ entrance.
 * Change recipes, animals, forum, marketplace, services, or live events.
 * Create additional files.
 * Modify the Worker or R2 configuration.
 -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Anderson Mills</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
    }

    .storefront {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .door {
      position: absolute;

      /* Physical 36" × 72" door — set to the door in the image */
      left: 50%;
      top: 50%;
      width: 10%;
      height: 45%;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      text-decoration: none;
      background: transparent;
      border: 0;
      padding: 0;
    }

    .open {
      display: inline-block;
      padding: 0.7rem 1.4rem;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      border: 2px solid #fff;
      border-radius: 6px;

      font-family: Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;

      white-space: nowrap;
    }

    /*
     * Mobile render.
     * The same storefront entrance is preserved while the Worker
     * supplies the mobile storefront artwork.
     */
    @media (max-width: 767px) {
      .storefront {
        object-position: center;
      }

      .door {
        left: 50%;
        top: 50%;
        width: 18%;
        height: 42%;
      }

      .open {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }

    /*
     * Desktop render.
     * The Worker supplies the desktop storefront artwork.
     */
    @media (min-width: 768px) {
      .storefront {
        object-position: center;
      }
    }
  </style>
</head>

<body>
  <main>

    <img
      class="storefront"
      src="/graphics/gimg_1789946532267_41keb4md.png"
      alt="Anderson Mills storefront"
    >

    <a
      class="door"
      href="/mill/"
      aria-label="Enter Anderson Mills"
    >
      <span class="open">OPEN</span>
    </a>

  </main>
</body>
</html>
```

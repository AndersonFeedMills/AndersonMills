<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anderson Mills</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    .storefront {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .door {
      position: absolute;

      /* Physical 36" × 72" door — set to the door in the image */
      left: 50%;
      top: 50%;
      width: 10%;
      height: 45%;

      display: block;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <main>

    <img
      class="storefront"
      src="/graphics/gimg_1789946532267_41keb4md.png"
      alt="Anderson Mills"
    >

    <a
      class="door"
      href="/mill/"
      aria-label="Enter Anderson Mills"
    ></a>

  </main>
</body>
</html>

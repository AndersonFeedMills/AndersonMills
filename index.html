<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anderson Mills</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding-top: 20px;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    .open-btn {
      margin-top: 24px;
      padding: 14px 28px;
      font-size: 18px;
      background: #ffffff;
      color: #000;
      border: none;
      cursor: pointer;
      border-radius: 4px;
    }

    .open-btn:hover {
      background: #e5e5e5;
    }
  </style>
</head>

<body>
  <main>
    <img
      src="/graphics/gimg_1789946532267_41keb4md.png"
      alt="Anderson Mills"
    >

    <button
      class="open-btn"
      onclick="window.location.href='/mill/'"
    >
      Open Anderson Mills
    </button>
  </main>
</body>
</html>

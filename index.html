<!--
 * FILE: index.html
 * TARGET: ANDERSON MILLS STOREFRONT
 *
 * MOBILE:
 * AndersonMills-mobile-storefront.png
 *
 * DESKTOP:
 * AndersonMills-desktop-storefront.png
 *
 * MOVEMENT:
 * Render the appropriate storefront artwork for the observer's device.
 * Preserve the storefront as the entrance and OPEN as the entrance to THE MILL.
 *
 * PURPOSE:
 * Make the storefront render as a mobile composition on phones and a
 * desktop composition on desktop screens.
 *
 * DOES NOT:
 * Change the storefront artwork.
 * Change the /mill/ entrance.
 * Create additional files.
 * Modify the Worker.
 * Modify R2.
 -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Anderson Mills</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 100dvh;
    }

    .storefront {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .door {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10%;
      height: 45%;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      text-decoration: none;
      background: transparent;
      border: 0;
      padding: 0;
    }

    .open {
      display: inline-block;
      padding: 0.7rem 1.4rem;

      background: rgba(0, 0, 0, 0.75);
      color: #fff;

      border: 2px solid #fff;
      border-radius: 6px;

      font-family: Arial, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      white-space: nowrap;
    }

    @media (max-width: 767px) {
      .door {
        left: 50%;
        top: 50%;
        width: 18%;
        height: 42%;
      }

      .open {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <main>

    <picture>
      <source
        media="(max-width: 767px)"
        srcset="/graphics/AndersonMills-mobile-storefront.png"
      >

      <img
        class="storefront"
        src="/graphics/AndersonMills-desktop-storefront.png"
        alt="Anderson Mills storefront"
      >
    </picture>

    <a
      class="door"
      href="/mill/"
      aria-label="Enter Anderson Mills"
    >
      <span class="open">OPEN</span>
    </a>

  </main>
</body>
</html>
